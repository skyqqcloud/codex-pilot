      function metrics(model=state.model) {
        const result={...samples[state.period][model]};
        if(prefs.scenario==='暂无完成请求')Object.assign(result,{output:0,input:0,reasoning:0,cache:null,requests:0});
        return result;
      }
      function icons() { if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}}); }
      function remember() {
        if(window.openai && typeof window.openai.setWidgetState==='function') {
          window.openai.setWidgetState({modelContent:{design:'紧凑面板',appearance:prefs.appearance,scenario:prefs.scenario,showTPS:prefs.showTPS},privateContent:{period:state.period,model:state.model,current:state.current,page:state.page,startLogin:state.startLogin,auto:Array.from(state.auto)}}).catch(()=>{});
        }
      }
      function applySaved(saved) {
        if(!saved)return;
        const visible=saved.modelContent||{},view=saved.privateContent||{};
        if(['跟随系统','浅色','深色'].includes(visible.appearance))prefs.appearance=visible.appearance;
        if(['正常','额度过期','暂无完成请求','统计读取失败','当前登录未保存'].includes(visible.scenario))prefs.scenario=visible.scenario;
        if(typeof visible.showTPS==='boolean')prefs.showTPS=visible.showTPS;
        if(samples[view.period])state.period=view.period;
        if(['all','sol','astra'].includes(view.model))state.model=view.model;
        if(seed.some(a=>a.id===view.current))state.current=view.current;
        if(['main','settings','stats','manage'].includes(view.page))state.page=view.page;
        if(typeof view.startLogin==='boolean')state.startLogin=view.startLogin;
        if(Array.isArray(view.auto))state.auto=new Set(view.auto.filter(id=>seed.some(a=>a.id===id)));
      }
      function quota(label,value,reset) {
        const known=value!==null,stale=prefs.scenario==='额度过期';
        const low=known&&value<=30;
        const classes=(known&&value<=10?'critical':low?'low':'')+(stale?' stale':'');
        return '<div><div class="cp-quota-top"><span>'+label+'</span><strong>'+(known?value+'%':'—')+'</strong></div><div class="cp-progress '+classes+'" style="--cp-pct:'+(known?value:0)+'%" role="progressbar" aria-label="'+label+'剩余额度" aria-valuemin="0" aria-valuemax="100" '+(known?'aria-valuenow="'+value+'"':'aria-valuetext="尚未刷新"')+'><span></span></div><div class="cp-reset">'+(stale?'待刷新':known?escape(reset):'刷新后显示')+'</div></div>';
      }
      function accountsHTML() {
        if(!state.accounts.length)return '<div class="cp-empty-accounts cp-empty"><strong>还没有保存的账号</strong><p>登录 Codex 后，点「保存登录」记录当前账号。</p></div>';
        return state.accounts.map(a=>{
          const current=a.id===state.current&&!needsSave();
          return '<button class="cp-account cursor-interaction" data-account="'+a.id+'" data-current="'+current+'" '+(needsSave()||state.quotaBusy?'disabled':'')+' data-tooltip="'+escape(a.name+' '+a.email)+'" aria-label="'+(current?'当前账号 ':'切换到 ')+escape(a.name)+'，'+escape(a.email)+'"><div class="cp-identity"><span class="cp-account-name">'+escape(a.name)+'</span>'+(current?'<span class="cp-current">'+icon('check')+'当前</span>':'')+'<span class="cp-email">'+escape(a.email)+'</span>'+(current?'':icon('chevron-right').replace('<i ','<i class="cp-switch-cue" '))+'</div><div class="cp-quota-grid">'+quota('5 小时',a.five,a.fiveReset)+quota('7 天',a.week,a.weekReset)+'</div></button>';
        }).join('');
      }
      function selectMarkup(selected,attribute,options) {
        return '<select '+attribute+' class="cursor-interaction">'+options.map(([value,label])=>'<option value="'+value+'" '+(String(value)===String(selected)?'selected':'')+'>'+label+'</option>').join('')+'</select>';
      }
      const periodOptions=[[60,'最近 1 分钟'],[300,'最近 5 分钟']];
      const modelOptions=[['all','全部模型'],['sol','gpt-6.1-sol'],['astra','gpt-6-astra']];
      function statsHTML() {
        const m=metrics(),failure=prefs.scenario==='统计读取失败';
        return '<div class="cp-setting"><label>统计窗口'+selectMarkup(state.period,'data-stat-period aria-label="统计窗口"',periodOptions)+'</label></div><div class="cp-setting"><label>统计模型'+selectMarkup(state.model,'data-stat-model aria-label="统计模型"',modelOptions)+'</label></div>'+(failure?'<div class="cp-empty"><strong>统计暂不可用</strong><p>检查本地记录的访问权限后重试。</p></div>':'<div class="cp-page-label">输出吞吐 <span style="float:right">token/s</span></div>'+['sol','astra'].filter(model=>state.model==='all'||model===state.model).map(model=>'<div class="cp-stat-row"><span>'+modelName(model)+'</span><strong>'+format(metrics(model).output)+'</strong></div>').join('')+'<div class="cp-stat-subrow"><span>窗口内完成请求</span><strong>'+m.requests+' 次</strong></div><div class="cp-stat-subrow"><span>活跃会话</span><strong>'+m.sessions+' 个</strong></div><details><summary class="cursor-interaction">更多用量指标</summary><div class="cp-stat-subrow"><span>输入 token/s</span><strong>'+format(m.input)+'</strong></div><div class="cp-stat-subrow"><span>推理 token/s</span><strong>'+format(m.reasoning)+'</strong></div><div class="cp-stat-subrow"><span>缓存比例</span><strong>'+(m.cache===null?'—':m.cache+'%')+'</strong></div><div class="cp-stat-subrow"><span>总 token/s</span><strong>'+format(m.input+m.output)+'</strong></div></details>')+'<p class="cp-help">按请求完成时统计最近 '+windowName()+' 的平均吞吐，包含本机不同账号与会话。此数值不代表单次请求的流式生成速度。</p>';
      }
      function settingsHTML() {
        const autoRows=state.accounts.map(a=>'<div class="cp-setting"><label><span>'+escape(a.name)+'<small>'+escape(a.email)+'</small></span><input type="checkbox" data-auto="'+a.id+'" '+(state.auto.has(a.id)?'checked':'')+' aria-label="'+escape(a.name)+' 自动刷新额度"></label></div>').join('');
        return '<div class="cp-setting"><label>登录时启动<input type="checkbox" id="cp-launch-login" '+(state.startLogin?'checked':'')+'></label></div><div class="cp-setting"><label><span>状态栏显示 TPS<small>显示当前所选模型的输出吞吐</small></span><input type="checkbox" id="cp-show-tps" '+(prefs.showTPS?'checked':'')+'></label></div><div class="cp-setting"><label>外观'+selectMarkup(prefs.appearance,'id="cp-appearance" aria-label="外观"',[['跟随系统','跟随系统'],['浅色','浅色'],['深色','深色']])+'</label></div><div class="cp-page-label">吞吐统计</div><div class="cp-setting"><label>默认窗口'+selectMarkup(state.period,'data-setting-period aria-label="默认统计窗口"',periodOptions)+'</label></div><p class="cp-help">本地统计每 15 秒更新。等待请求完成后，新的用量才会进入统计。</p><div class="cp-page-label">账号额度自动刷新</div>'+autoRows+'<p class="cp-help">开启的账号每 5 分钟联网刷新额度。</p>';
      }
      function manageHTML() {
        return state.accounts.map((a,index)=>'<div class="cp-manage-row" data-managed="'+a.id+'" draggable="true"><div class="cp-manage-identity"><span>'+escape(a.name)+'</span>'+(a.id===state.current?'<span class="cp-current" style="margin-left:7px">当前</span>':'')+'<small>'+escape(a.email)+'</small></div><button class="cp-icon-button cursor-interaction" data-move="'+a.id+'" data-direction="-1" aria-label="上移 '+escape(a.name)+'" '+(index===0?'disabled':'')+'>'+icon('chevron-up')+'</button><button class="cp-icon-button cursor-interaction" data-move="'+a.id+'" data-direction="1" aria-label="下移 '+escape(a.name)+'" '+(index===state.accounts.length-1?'disabled':'')+'>'+icon('chevron-down')+'</button><button class="cp-icon-button cp-danger cursor-interaction" data-delete="'+a.id+'" aria-label="删除 '+escape(a.name)+'" '+(a.id===state.current?'disabled':'')+'>'+icon('trash-2')+'</button></div>').join('')+'<p class="cp-help">拖动账号或使用箭头调整顺序。当前使用的账号需要先切换后才能删除。</p>';
      }
      function dialogHTML() {
        if(!state.modal)return '';
        const {type,id}=state.modal,a=state.accounts.find(item=>item.id===id);
        let title='',text='',action='',mark='arrow-left-right';
        if(type==='switch'&&a){title='切换到 '+escape(a.name)+'？';text=escape(a.email)+'<br><br>会退出并重新打开 Codex。正在进行的任务会中断。';action='退出并切换';}
        else if(type==='delete'&&a){title='删除 '+escape(a.name)+'？';text=escape(a.email)+'<br><br>移除保存的登录。下次使用这个账号时，需要重新登录。';action='删除账号';mark='trash-2';}
        else if(type==='add'){title='登录一个新账号';text='先保存当前登录，再退出 Codex 并打开登录界面。<br><br>登录完成后，回到状态栏点「保存登录」。';action='打开登录';mark='user-round-plus';}
        return '<div class="cp-dialog-mark">'+icon(mark)+'</div><h3 id="cp-dialog-title">'+title+'</h3><p>'+text+'</p><div class="cp-dialog-buttons"><button class="cursor-interaction" data-modal-cancel>取消</button><button class="cursor-interaction '+(type==='delete'?'cp-delete-button':'cp-primary')+'" data-modal-confirm>'+action+'</button></div>';
      }
      function render() {
        root.style.colorScheme=prefs.appearance==='浅色'?'light':prefs.appearance==='深色'?'dark':'light dark';
        $('#cp-panel').hidden=!state.open;
        $('#cp-trigger').setAttribute('aria-expanded',String(state.open));
        $('#cp-bar-rate').hidden=!prefs.showTPS;
        $('#cp-bar-rate').textContent=prefs.scenario==='统计读取失败'?'— t/s':format(metrics().output)+' t/s';
        const main=state.page==='main';
        $('#cp-main').hidden=!main;$('#cp-secondary').hidden=main;
        $('#cp-header-mark').toggleAttribute('hidden',!main);$('#cp-back').hidden=main;$('#cp-settings').hidden=!main;
        $('#cp-title').textContent=main?'Codex 切号':state.page==='stats'?'模型吞吐':state.page==='manage'?'管理账号':'设置';
        const m=metrics();
        $('#cp-output').textContent=format(m.output);$('#cp-requests').textContent=m.requests;$('#cp-sessions').textContent=m.sessions;
        $('#cp-model').value=state.model;
        root.querySelectorAll('[data-period]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.period)===state.period)));
        $('#cp-readout').hidden=prefs.scenario==='统计读取失败';$('#cp-read-error').hidden=prefs.scenario!=='统计读取失败';
        const notice=$('#cp-auth-notice');notice.hidden=!needsSave();
        notice.innerHTML=icon('user-round')+'<span>'+(state.pending?'登录完成后，先保存新账号，再切换。':'当前登录尚未保存。先保存登录，再切换账号。')+'</span>';
        const stale=prefs.scenario==='额度过期';$('#cp-quota-notice').hidden=!stale;
        $('#cp-quota-notice').innerHTML=icon('clock-3')+'<span>额度已到重置时间，仍显示上次数据。</span><button class="cursor-interaction" data-action="refresh">刷新</button>';
        $('#cp-accounts').innerHTML=accountsHTML();$('#cp-account-count').textContent=state.accounts.length;
        $('#cp-quota-time').textContent=state.quotaUpdated?'刚刚更新':stale?'上次更新于昨天':'11:30 更新';
        const enabled=state.accounts.filter(a=>state.auto.has(a.id));
        $('#cp-auto-label').innerHTML=icon('clock-arrow-up')+(enabled.length===1?escape(enabled[0].name)+' 自动刷新':enabled.length?enabled.length+' 个自动刷新':'自动刷新已关闭');
        $('#cp-refresh').disabled=state.quotaBusy;
        $('#cp-refresh').innerHTML=icon(state.quotaBusy?'loader-circle':'refresh-cw').replace('<i ','<i class="'+(state.quotaBusy?'cp-busy-icon':'')+'" ');
        $('#cp-save').classList.toggle('cp-save-needed',needsSave());
        $('#cp-toast').hidden=!state.toast;$('#cp-toast').innerHTML=state.toast?icon('check')+escape(state.toast):'';
        if(!main)$('#cp-secondary').innerHTML=state.page==='stats'?statsHTML():state.page==='manage'?manageHTML():settingsHTML();
        $('#cp-modal').hidden=!state.modal;$('#cp-content').inert=Boolean(state.modal);
        $('#cp-modal').innerHTML=dialogHTML();
        icons();
      }
      function go(page) { state.page=page;state.toast='';render();remember();$('#cp-back').focus(); }
      function openModal(type,id) { state.modal={type,id};render();$('#cp-modal [data-modal-cancel]').focus(); }
      function closeModal() { const id=state.modal?.id;state.modal=null;render();if(id&&state.page==='main')$('[data-account="'+id+'"]').focus();else if(state.page!=='main')$('#cp-back').focus(); }
      function refreshQuota() {
        if(state.quotaBusy)return;
        state.quotaBusy=true;state.toast='';render();
        setTimeout(()=>{state.quotaBusy=false;state.quotaUpdated=true;if(prefs.scenario==='额度过期')prefs.scenario='正常';state.accounts.forEach(a=>{if(a.five===null){a.five=100;a.week=100;a.fiveReset='等待使用';a.weekReset='等待使用';}});state.toast='账号额度已刷新';render();remember();},650);
      }
      function moveAccount(id,direction) {
        const from=state.accounts.findIndex(a=>a.id===id),to=from+direction;
        if(from<0||to<0||to>=state.accounts.length)return;
        const [item]=state.accounts.splice(from,1);state.accounts.splice(to,0,item);render();remember();
        const button=$('[data-move="'+id+'"][data-direction="'+direction+'"]');if(button&&!button.disabled)button.focus();
      }
      root.addEventListener('click',event=>{
        const button=event.target.closest('button');if(!button||button.disabled)return;
        if(button.id==='cp-trigger'){state.open=!state.open;state.modal=null;if(state.open)state.page='main';render();remember();return;}
        if(button.id==='cp-settings'){go('settings');return;}
        if(button.id==='cp-back'){state.page='main';render();remember();$('#cp-settings').focus();return;}
        if(button.id==='cp-refresh'||button.dataset.action==='refresh'){refreshQuota();return;}
        if(button.dataset.account){if(!needsSave()&&button.dataset.account!==state.current)openModal('switch',button.dataset.account);return;}
        if(button.dataset.page){go(button.dataset.page);return;}
        if(button.dataset.period){state.period=Number(button.dataset.period);render();remember();$('[data-period="'+state.period+'"]').focus();return;}
        if(button.hasAttribute('data-modal-cancel')){closeModal();return;}
        if(button.hasAttribute('data-modal-confirm')){
          const modal=state.modal;if(!modal)return;
          state.modal=null;
          if(modal.type==='switch'){state.current=modal.id;state.toast='已切换到 '+state.accounts.find(a=>a.id===modal.id).name;}
          else if(modal.type==='delete'){state.accounts=state.accounts.filter(a=>a.id!==modal.id);state.auto.delete(modal.id);}
          else if(modal.type==='add'){state.pending=true;state.page='main';}
          render();remember();if(state.page==='main')$('#cp-save').focus();else $('#cp-back').focus();return;
        }
        if(button.dataset.move){moveAccount(button.dataset.move,Number(button.dataset.direction));return;}
        if(button.dataset.delete){if(button.dataset.delete!==state.current)openModal('delete',button.dataset.delete);return;}
        if(button.dataset.action==='save'){
          if(needsSave()){const id='new'+(++state.newIndex);state.accounts.push({id,name:'Plus',email:'new•••@gmail.com',five:null,week:null,fiveReset:'',weekReset:''});state.current=id;state.pending=false;if(prefs.scenario==='当前登录未保存')prefs.scenario='正常';}
          state.toast='当前登录已保存';render();remember();$('#cp-save').focus();return;
        }
        if(button.dataset.action==='add'){if(!needsSave())openModal('add');else{state.toast='先保存当前登录，再添加账号';render();}return;}
        if(button.dataset.action==='retry-stats'){prefs.scenario='正常';render();remember();return;}
        if(button.dataset.action==='quit'){state.open=false;render();remember();$('#cp-trigger').focus();}
      });
      root.addEventListener('change',event=>{
        const input=event.target;
        if(input.id==='cp-model'||input.hasAttribute('data-stat-model'))state.model=input.value;
        else if(input.hasAttribute('data-stat-period')||input.hasAttribute('data-setting-period'))state.period=Number(input.value);
        else if(input.id==='cp-show-tps')prefs.showTPS=input.checked;
        else if(input.id==='cp-launch-login')state.startLogin=input.checked;
        else if(input.id==='cp-appearance')prefs.appearance=input.value;
        else if(input.dataset.auto){input.checked?state.auto.add(input.dataset.auto):state.auto.delete(input.dataset.auto);}
        const identifier=input.id,auto=input.dataset.auto;
        const field=['data-stat-model','data-stat-period','data-setting-period'].find(attribute=>input.hasAttribute(attribute));
        render();remember();if(identifier)$('#'+identifier)?.focus();else if(auto)$('[data-auto="'+auto+'"]').focus();else if(field)$('['+field+']').focus();
      });
      root.addEventListener('keydown',event=>{
        if(event.key==='Escape'){if(state.modal)closeModal();else if(state.page!=='main'){state.page='main';render();$('#cp-settings').focus();}else{state.open=false;render();$('#cp-trigger').focus();}remember();return;}
        if(state.modal&&event.key==='Tab'){
          const controls=$('#cp-modal').querySelectorAll('button');
          if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls[controls.length-1].focus();}
          else if(!event.shiftKey&&document.activeElement===controls[controls.length-1]){event.preventDefault();controls[0].focus();}
        }
      });
      root.addEventListener('dragstart',event=>{const row=event.target.closest('[data-managed]');if(row){state.dragID=row.dataset.managed;if(event.dataTransfer){event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',state.dragID);}}});
      root.addEventListener('dragover',event=>{if(event.target.closest('[data-managed]'))event.preventDefault();});
      root.addEventListener('drop',event=>{const row=event.target.closest('[data-managed]');if(!row||!state.dragID)return;event.preventDefault();const from=state.accounts.findIndex(a=>a.id===state.dragID),to=state.accounts.findIndex(a=>a.id===row.dataset.managed);if(from>=0&&to>=0&&from!==to){const [a]=state.accounts.splice(from,1);state.accounts.splice(to,0,a);render();remember();}state.dragID=null;});
      applySaved(window.openai&&window.openai.widgetState);render();
      window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState;if(saved){applySaved(saved);render();}});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{state.modal=null;state.page='main';state.open=true;render();remember();}});tweak.addSelect(prefs,'appearance',{label:'外观',options:['跟随系统','浅色','深色']});tweak.addToggle(prefs,'showTPS',{label:'状态栏显示输出 TPS'});tweak.addSelect(prefs,'scenario',{label:'演示状态',options:['正常','额度过期','暂无完成请求','统计读取失败','当前登录未保存']});}
    })();
  </script>
</div>
